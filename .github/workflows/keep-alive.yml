# Ping Render free web service so it does not spin down after 15m idle.
# Requires repo secret BACKEND_READY_URL = https://<service>.onrender.com/api/ready
#
# Ceiling: keep-alive ~24/7 uses most of the 750 free instance-hours/month.
# Prefer UptimeRobot (5–10 min) if Actions schedules drift — see deployment.md.

name: keep-alive

on:
  schedule:
    # Every 10 minutes — under Render's 15m idle window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ready
        env:
          URL: ${{ secrets.BACKEND_READY_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Set repo secret BACKEND_READY_URL (e.g. https://hk-small-store-api.onrender.com/api/ready)"
            exit 1
          fi
          # Long timeout: first ping after sleep can take ~60s while Render spins up.
          curl -fsS --max-time 90 "$URL"
          echo
