# Exported Render Blueprint — sync/env secrets in Dashboard after first deploy.
# Docs: docs/06-operations/deployment.md
# Free tier sleeps after 15m idle — keep-alive via GitHub Actions / UptimeRobot → /api/ready

services:
  - type: web
    name: hk-small-store-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    # Free: no preDeployCommand — migrate on each cold start (paid can split).
    startCommand: pnpm run db:migrate && pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: HOLD_EXPIRE_INTERVAL_MS
        value: "180000"
