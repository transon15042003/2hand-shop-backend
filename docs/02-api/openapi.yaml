        - code
        - name
        - category
        - import_date
        - initial_capital
        - processing_cost
        - total_investment
        - total_items_count
        - sold_items_count
        - total_revenue
        - break_even_target
        - is_broken_even
        - status
      properties:
        id:
          type: string
          example: "batch_1"
        code:
          type: string
          example: "KN2410"
        name:
          type: string
          example: "Kiện Áo Khoác & Len Thu Đông Tuyển Chọn"
        category:
          $ref: '#/components/schemas/ItemCategory'
        import_date:
          type: string
          format: date
          example: "2024-10-15"
        initial_capital:
          type: integer
          description: Vốn nhập kiện ban đầu (VND)
          example: 18000000
        processing_cost:
          type: integer
          description: Chi phí giặt là, bảo dưỡng xử lý lỗi (VND)
          example: 1200000
        total_investment:
          type: integer
          description: Tổng vốn đầu tư = Vốn nhập + Chi phí xử lý (VND)
          example: 19200000
        total_items_count:
          type: integer
          description: Tổng số món bóc tách từ kiện
          example: 45
        sold_items_count:
          type: integer
          description: Số món đã bán
          example: 32
        total_revenue:
          type: integer
          description: Doanh thu thực tế đã bán (VND)
          example: 26800000
        break_even_target:
          type: integer
          description: Cột mốc hoàn vốn an toàn (thường là 130% vốn đầu tư)
          example: 24960000
        is_broken_even:
          type: boolean
          example: true
        status:
          $ref: '#/components/schemas/BatchStatus'

    CreateBatchRequest:
      type: object
      required:
        - code
        - name
        - category
        - import_date
        - initial_capital
        - processing_cost
      properties:
        code:
          type: string
          example: "KN2411"
        name:
          type: string
          example: "Kiện Sơ Mi Vintage Nhật Bản"
        category:
          $ref: '#/components/schemas/ItemCategory'
        import_date:
          type: string
          format: date
          example: "2024-11-01"
        initial_capital:
          type: integer
          minimum: 0
          example: 15000000
        processing_cost:
          type: integer
          minimum: 0
          example: 800000

    BatchDetail:
      allOf:
        - $ref: '#/components/schemas/BatchSummary'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ItemAdminSummary'

    CashFlowSummary:
      type: object
      required:
        - total_revenue
        - cod_pending_balance
        - bank_balance_received
        - shipping_fee_collected
        - shipping_cost_paid
        - net_shipping_margin
        - refunds_paid
        - batch_capital_spent
        - net_cash_flow
        - deposits_received
        - return_charges
        - period
        - series
      properties:
        period:
          type: string
          enum: [day, week, month]
        total_revenue:
          type: integer
          description: Doanh thu món của đơn hoàn tất trong khoảng của `series` (VND). Mọi tổng dòng tiền dưới đây dùng cùng khoảng này; `net_cash_flow` bằng tổng `series[].net`.
          example: 148500000
        cod_pending_balance:
          type: integer
          description: Tiền thu hộ COD các hãng vận chuyển đang giữ chưa giải ngân (VND)
          example: 18450000
        bank_balance_received:
          type: integer
          description: Tiền thực tế đã về tài khoản shop trong khoảng = tiền đơn đã thu (sau khi trừ cọc) + tiền cọc đã nhận (VND)
          example: 130050000
        shipping_fee_collected:
          type: integer
          description: Cước ship đã thực thu từ khách (chỉ đơn đã thu tiền; COD chưa đối soát không tính) trong khoảng của `series` (VND)
          example: 4500000
        shipping_cost_paid:
          type: integer
          description: Tổng cước thực trả cho các đơn vị vận chuyển (VND)
          example: 4230000
        net_shipping_margin:
          type: integer
          description: Tổng chênh lệch cước (dương dư cước, âm bù cước) (VND)
          example: 270000
        refunds_paid:
          type: integer
          description: Tổng tiền đã hoàn cho khách trả hàng (VND)
          example: 390000
        batch_capital_spent:
          type: integer
          description: Tổng vốn đã chi cho các kiện (tiền kiện + chi phí xử lý) (VND)
          example: 49900000
        deposits_received:
          type: integer
          description: Tiền cọc đã nhận trong khoảng (đã gồm trong `bank_balance_received`) (VND)
          example: 100000
        return_charges:
          type: integer
          description: Tiền shop giữ lại trong khoảng = cọc bị mất (trả hàng, hoặc khách hủy sau khi đơn đã xác nhận) + phí ship 2 chiều khi trả hàng (đã trừ vào `refunds_paid`) (VND)
          example: 50000
        net_cash_flow:
          type: integer
          description: Dòng tiền ròng = tiền thực về - cước thực trả - tiền hoàn - vốn kiện (VND). Có thể âm.
          example: -1200000
        series:
          type: array
          description: Dòng tiền theo từng mốc của `period`, cũ trước mới sau
          items:
            $ref: '#/components/schemas/CashFlowPoint'

    CashFlowPoint:
      type: object
      required:
        - label
        - period_start
        - cash_in
        - cash_out
        - net
      properties:
        label:
          type: string
          example: "Tuần 39"
        period_start:
          type: string
          format: date
          example: "2026-09-21"
        cash_in:
          type: integer
          description: Tiền thực về trong mốc (VND)
        cash_out:
          type: integer
          description: Cước thực trả + tiền hoàn + vốn kiện trong mốc (VND)
        net:
          type: integer
          description: cash_in - cash_out (VND)

    ReconciliationSession:
      type: object
      required:
        - id
        - session_code
        - carrier_name
        - total_cod_amount
        - carrier_fee
        - net_received_amount
        - status
        - order_count
        - order_codes
      properties:
        id:
          type: string
          example: "rec_001"
        session_code:
          type: string
          example: "DS-GHN-241022"
        carrier_name:
          type: string
          example: "Giao Hàng Nhanh (GHN)"
        total_cod_amount:
          type: integer
          description: Tiền hàng COD bưu cục thu từ khách (VND)
          example: 24500000
        carrier_fee:
          type: integer
          description: Cước vận chuyển bị khấu trừ (VND)
          example: 180000
        net_received_amount:
          type: integer
          description: Số tiền thực nhận chuyển khoản ngân hàng (VND)
