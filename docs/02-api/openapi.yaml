    CreateOrderRequest:
      type: object
      required:
        - customer_name
        - customer_phone
        - shipping_address
        - payment_method
        - item_ids
        - policy_accepted
        - policy_version
      properties:
        customer_name:
          type: string
          example: "Nguyễn Văn An"
        customer_phone:
          type: string
          example: "0912345678"
        shipping_address:
          type: string
          example: "Số 48 Tràng Tiền, Hoàn Kiếm, Hà Nội"
        customer_note:
          type: string
          example: "Gọi trước khi giao 30 phút"
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        item_ids:
          type: array
          items:
            type: string
          minItems: 1
          example: ["KN2410-001", "KN2410-004"]
        policy_accepted:
          type: boolean
          description: Khách đã tick "Tôi đã đọc và đồng ý với chính sách đặt cọc & hoàn hàng". Thiếu hoặc false → 400 `POLICY_NOT_ACCEPTED`.
          example: true
        policy_version:
          type: integer
          description: Phiên bản chính sách khách đã đọc (`policy_version` từ `GET /settings`). Cũ hơn bản hiện hành → 400 `POLICY_VERSION_OUTDATED`.
          example: 1
        policy_accepted_at:
          type: string
          format: date-time
          description: Giờ khách tick đồng ý theo máy khách (tham khảo). Server lưu giờ nhận đơn của chính nó vào `policy_accepted_at` của đơn.

    PublicShopSettings:
      type: object
      description: |
        Tham số nghiệp vụ hiện hành và thông tin liên hệ / nhận cọc của shop (ADR 005). Mặc định 50.000₫ / 50.000₫ / 2 ngày.
        Thông tin ngân hàng là công khai vì khách cần để chuyển cọc. Nội dung chuyển khoản luôn là số điện thoại của khách.
      required:
        - deposit_amount
        - return_fee
        - return_window_days
        - order_hold_minutes
        - policy_version
        - shop_phone
        - shop_zalo
        - shop_messenger_url
        - bank_name
        - bank_account_number
        - bank_account_holder
        - bank_qr_image_url
        - shipping_fee_presets
        - default_shipping_fee
        - freeship_min_items
      properties:
        deposit_amount:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Tiền cọc cho đơn đầu tiên của một số điện thoại (VND). 0 = không thu cọc.
          example: 50000
        return_fee:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Phí ship 2 chiều khách chịu khi trả đơn không có cọc (VND). 0 = miễn phí.
          example: 50000
        return_window_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Số ngày được trả kể từ lúc đơn hoàn tất
          example: 2
        order_hold_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: Số phút giữ đơn mới để shop kiểm tra (khách chuyển cọc nếu cần). Hết giờ mà shop chưa xử lý → đơn cần cọc chưa nhận cọc thì tự hủy, món về kệ; đơn không cần cọc hoặc đã nhận cọc thì tự động xác nhận. Mỗi đơn gia hạn được 1 lần, ít hơn số phút này.
          example: 30
        policy_version:
          type: integer
          minimum: 1
          description: Phiên bản chính sách cọc & hoàn hàng. Tự tăng khi đổi tiền cọc, phí trả hàng, hạn trả, thời gian giữ đơn, phí ship mặc định hoặc ngưỡng freeship (các số khách thấy ở bước chính sách và tổng tiền). Checkout gửi kèm khi khách đồng ý.
          example: 1
        shop_phone:
          type: string
          pattern: '^0[0-9]{9,10}$'
          description: Số điện thoại shop (gọi). Chỉ chữ số.
          example: "0900000000"
        shop_zalo:
          type: string
          description: Số Zalo (chỉ chữ số) hoặc link `https://zalo.me/…`
          example: "0900000000"
        shop_messenger_url:
          type: string
          nullable: true
          description: Link Facebook/Messenger (không bắt buộc)
          example: null
        bank_name:
          type: string
          example: "Vietcombank"
        bank_account_number:
          type: string
          pattern: '^[0-9]{6,20}$'
          example: "0000000000"
        bank_account_holder:
          type: string
          description: Tên chủ tài khoản (in hoa)
          example: "CHU SHOP"
        bank_qr_image_url:
          type: string
          nullable: true
          description: Link ảnh mã QR chuyển khoản (không bắt buộc)
          example: null
        shipping_fee_presets:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: |
            Các mức phí ship 1 chiều shop hay dùng (VND, theo thứ tự shop sắp) để đổi phí của một đơn khi xác nhận (khu vực đặc biệt), hoặc nhập mức khác.
            Đổi danh sách không tăng `policy_version` và không đổi đơn cũ.
          items:
            type: integer
            minimum: 0
            maximum: 1000000
            multipleOf: 1000
          example: [20000, 30000]
        default_shipping_fee:
          type: integer
          minimum: 0
          maximum: 1000000
          multipleOf: 1000
          description: |
            Phí ship 1 chiều mặc định (VND): shop đồng giá với hãng vận chuyển cho hầu hết khu vực. Checkout tính tổng chính xác = tiền món + phí này − cọc.
            Đơn mới chốt phí này (`shipping_fee`, `default_shipping_fee`); tự xác nhận dùng phí đã chốt trên đơn. Đổi giá trị tăng `policy_version`.
          example: 30000
        freeship_min_items:
          type: integer
          minimum: 0
          maximum: 50
          description: Đơn có từ N món trở lên được miễn phí ship (phí ship = 0). 0 = tắt freeship. Đổi giá trị tăng `policy_version`.
          example: 4

    ShopSettings:
      allOf:
        - $ref: '#/components/schemas/PublicShopSettings'
        - type: object
          required:
            - updated_at
          properties:
            updated_at:
