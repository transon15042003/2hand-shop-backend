          maxLength: 6
          example: "868868"

    CustomerLoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: "Email hoặc số điện thoại của khách hàng"
          example: "khachhang@2handshop.vn"
        password:
          type: string
          format: password
          example: "123456"

    CustomerAuthResponse:
      type: object
      required:
        - token
        - customer
      properties:
        token:
          type: string
          description: Token phiên cho client API (gửi header Authorization dạng Bearer). Web không lưu token này, chỉ dùng cookie httpOnly (ADR 006).
          example: "mock-jwt-customer-token"
        customer:
          $ref: '#/components/schemas/CustomerProfile'

    CustomerProfile:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - is_verified
        - has_completed_order
        - created_at
      properties:
        id:
          type: string
          example: "KH-1001"
        name:
          type: string
          example: "Nguyễn Văn Minh"
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: "khachhang@2handshop.vn"
        is_verified:
          type: boolean
          example: true
        has_completed_order:
          type: boolean
          description: Tài khoản đã có ít nhất một đơn ở trạng thái `completed` (đơn đã trả hàng không tính). Quyết định cách đặt hàng (Son 2026-10) - true là 1 bước, miễn cọc; false là 2 bước, đơn đầu cần cọc. Chỉ có trên hồ sơ của chính khách.
          example: true
        default_shipping_address:
          type: string
          nullable: true
          example: "Số 48 Tràng Tiền, Hoàn Kiếm, Hà Nội"
        default_shipping_note:
          type: string
          nullable: true
          example: "Gọi trước khi giao"
        created_at:
          type: string
          format: date-time
          example: "2024-09-01T08:00:00Z"

    CustomerProfileUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Nguyễn Văn Minh"
        default_shipping_address:
          type: string
          nullable: true
        default_shipping_note:
          type: string
          nullable: true

    CustomerOrderSummary:
      type: object
      required:
        - default_shipping_fee
        - freeship_applied
        - deposit_status
        - deposit_amount
        - hold_expires_at
        - agreed_return_fee
        - return_window_days
        - amount_due
        - order_code
        - order_status
        - payment_status
        - payment_method
        - total_items
        - subtotal
        - total
        - items
        - created_at
      properties:
        default_shipping_fee:
          type: integer
          nullable: true
          description: Phí ship mặc định (1 chiều) lấy từ cài đặt `default_shipping_fee` lúc đặt đơn, trước khi tính freeship. null với đơn tạo trước khi có phí mặc định.
          example: 30000
        freeship_applied:
          type: boolean
          description: Đơn đủ số món để freeship (cài đặt `freeship_min_items`, chốt lúc đặt) nên `shipping_fee` lúc đặt = 0. Shop vẫn đổi được phí khi xác nhận (khu vực đặc biệt); UI admin cảnh báo khi đổi.
          example: false
        order_code:
          type: string
          example: "DH-260921"
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        total_items:
          type: integer
          example: 1
        subtotal:
          type: integer
          example: 320000
        shipping_fee:
          type: integer
          nullable: true
        total:
          type: integer
          example: 320000
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemPublicSummary'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        return_deadline:
          type: string
          format: date-time
          nullable: true
        deposit_status:
          $ref: '#/components/schemas/DepositStatus'
        deposit_amount:
          type: integer
          description: Tiền cọc của đơn, chốt theo cài đặt lúc tạo đơn (mặc định 50.000₫ với số điện thoại chưa có đơn hoàn tất, 0 nếu không cần cọc)
          example: 50000
        amount_due:
          type: integer
          description: Số tiền khách còn phải trả cho đơn = `total` − tiền cọc đã nhận (cọc đã chuyển được trừ vào đơn)
          example: 750000
        agreed_return_fee:
          type: integer
          description: Phí ship 2 chiều khách chịu nếu trả đơn không có cọc, chốt theo cài đặt lúc tạo đơn (ADR 005). Đổi cài đặt sau đó không đổi đơn cũ.
          example: 50000
        return_window_days:
          type: integer
          description: Số ngày được trả kể từ lúc hoàn tất, chốt theo cài đặt lúc tạo đơn (ADR 005)
          example: 2
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hết giờ giữ đơn (đơn `new`). Hết giờ mà shop chưa xử lý → đơn cần cọc chưa nhận cọc thì tự hủy (món về kệ); đơn không cần cọc hoặc đã nhận cọc thì tự động xác nhận. Chỉ có ý nghĩa khi đơn còn `new`.

