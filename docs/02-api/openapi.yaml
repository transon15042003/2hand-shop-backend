        shop_messenger_url:
          type: string
          nullable: true
          description: Gửi `null` hoặc chuỗi rỗng để bỏ
        bank_name:
          type: string
          example: "Vietcombank"
        bank_account_number:
          type: string
          example: "0000000000"
        bank_account_holder:
          type: string
          example: "CHU SHOP"
        bank_qr_image_url:
          type: string
          nullable: true
          description: Gửi `null` hoặc chuỗi rỗng để bỏ
        shipping_fee_presets:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: Thay cả danh sách (thứ tự giữ nguyên). 1–10 mức, mỗi mức 0–1.000.000₫, bội số 1.000₫, không trùng.
          items:
            type: integer
            minimum: 0
            maximum: 1000000
            multipleOf: 1000
          example: [20000, 30000, 45000]
        default_shipping_fee:
          type: integer
          minimum: 0
          maximum: 1000000
          multipleOf: 1000
          description: Phí ship 1 chiều mặc định (VND), bội số 1.000₫
          example: 30000
        freeship_min_items:
          type: integer
          minimum: 0
          maximum: 50
          description: Freeship từ N món (0 = tắt)
          example: 4

    CustomerCancelRequest:
      type: object
      required:
        - phone
        - reason
      properties:
        phone:
          type: string
          description: Số điện thoại đặt hàng (khớp với đơn)
          example: "0901234567"
        reason:
          type: string
          minLength: 3
          maxLength: 300
          description: Lý do hủy (bắt buộc, 3–300 ký tự)
          example: "Đặt nhầm size"
        expected_status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          description: Trạng thái đơn khách đang thấy. Khác trạng thái hiện tại (VD đơn vừa tự động xác nhận) → 409 `ORDER_STATUS_CHANGED`, để khách không mất cọc ngoài ý muốn.

    DepositCheckResponse:
      type: object
      required:
        - deposit_required
        - deposit_amount
        - return_fee
      properties:
        deposit_required:
          type: boolean
          description: true nếu số điện thoại chưa có đơn hoàn tất (đơn này phải cọc)
        deposit_amount:
          type: integer
          description: Tiền cọc phải chuyển (0 nếu không cần)
          example: 50000
        return_fee:
          type: integer
          description: Phí ship 2 chiều khách chịu khi trả hàng nếu đơn không có cọc (đơn có cọc thì mất cọc thay cho phí này)
          example: 50000

    OrderConfirmationResponse:
      type: object
      required:
        - default_shipping_fee
        - freeship_applied
        - deposit_status
        - deposit_amount
        - hold_expires_at
        - agreed_return_fee
        - return_window_days
        - amount_due
        - order_code
        - customer_name
        - customer_phone
        - shipping_address
        - payment_method
        - payment_status
        - order_status
        - subtotal
        - items
        - created_at
      properties:
        default_shipping_fee:
          type: integer
          nullable: true
          description: Phí ship mặc định (1 chiều) lấy từ cài đặt `default_shipping_fee` lúc đặt đơn, trước khi tính freeship. null với đơn tạo trước khi có phí mặc định.
          example: 30000
        freeship_applied:
          type: boolean
          description: Đơn đủ số món để freeship (cài đặt `freeship_min_items`, chốt lúc đặt) nên `shipping_fee` lúc đặt = 0. Shop vẫn đổi được phí khi xác nhận (khu vực đặc biệt); UI admin cảnh báo khi đổi.
          example: false
        order_code:
          type: string
          example: "DH-260901"
        customer_name:
          type: string
          example: "Nguyễn Văn An"
        customer_phone:
          type: string
          example: "0912345678"
        shipping_address:
          type: string
          example: "Số 48 Tràng Tiền, Hoàn Kiếm, Hà Nội"
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        subtotal:
          type: integer
          description: Tổng tiền các món đồ (VND)
          example: 770000
        shipping_fee:
          type: integer
          nullable: true
          description: Phí ship 1 chiều của đơn. Lúc đặt = phí ship mặc định của shop (hoặc 0 khi freeship); shop có thể đổi khi xác nhận. null chỉ với đơn cũ chưa chốt phí.
          example: 30000
        total:
          type: integer
          description: Tiền món + phí ship 1 chiều (VND)
          example: 800000
        deposit_status:
          $ref: '#/components/schemas/DepositStatus'
        deposit_amount:
          type: integer
          description: Tiền cọc của đơn, chốt theo cài đặt lúc tạo đơn (mặc định 50.000₫ với số điện thoại chưa có đơn hoàn tất, 0 nếu không cần cọc)
          example: 50000
        amount_due:
          type: integer
          description: Số tiền khách còn phải trả cho đơn = `total` − tiền cọc đã nhận (cọc đã chuyển được trừ vào đơn)
          example: 750000
        agreed_return_fee:
          type: integer
          description: Phí ship 2 chiều khách chịu nếu trả đơn không có cọc, chốt theo cài đặt lúc tạo đơn (ADR 005). Đổi cài đặt sau đó không đổi đơn cũ.
          example: 50000
        return_window_days:
          type: integer
          description: Số ngày được trả kể từ lúc hoàn tất, chốt theo cài đặt lúc tạo đơn (ADR 005)
          example: 2
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hết giờ giữ đơn (đơn `new`). Hết giờ mà shop chưa xử lý → đơn cần cọc chưa nhận cọc thì tự hủy (món về kệ); đơn không cần cọc hoặc đã nhận cọc thì tự động xác nhận. Chỉ có ý nghĩa khi đơn còn `new`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemPublicSummary'
        created_at:
          type: string
          format: date-time

    OrderTrackingDetail:
