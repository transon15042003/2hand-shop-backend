        return_fee:
          type: integer
          nullable: true
          description: Phí ship 2 chiều đã thu khi trả đơn không có cọc (= `agreed_return_fee`, trừ vào tiền hoàn)
        deposit_status:
          $ref: '#/components/schemas/DepositStatus'
        deposit_amount:
          type: integer
          description: Tiền cọc của đơn, chốt theo cài đặt lúc tạo đơn (mặc định 50.000₫ với số điện thoại chưa có đơn hoàn tất, 0 nếu không cần cọc)
          example: 50000
        amount_due:
          type: integer
          description: Số tiền khách còn phải trả cho đơn = `total` − tiền cọc đã nhận (cọc đã chuyển được trừ vào đơn)
          example: 750000
        agreed_return_fee:
          type: integer
          description: Phí ship 2 chiều khách chịu nếu trả đơn không có cọc, chốt theo cài đặt lúc tạo đơn (ADR 005). Đổi cài đặt sau đó không đổi đơn cũ.
          example: 50000
        return_window_days:
          type: integer
          description: Số ngày được trả kể từ lúc hoàn tất, chốt theo cài đặt lúc tạo đơn (ADR 005)
          example: 2
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hết giờ giữ đơn (đơn `new`). Hết giờ mà shop chưa xử lý → đơn cần cọc chưa nhận cọc thì tự hủy (món về kệ); đơn không cần cọc hoặc đã nhận cọc thì tự động xác nhận. Chỉ có ý nghĩa khi đơn còn `new`.
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        customer_name:
          type: string
          example: "Nguyễn Văn An"
        customer_phone:
          type: string
          example: "0912345678"
        shipping_address:
          type: string
          example: "Số 48 Tràng Tiền, Hoàn Kiếm, Hà Nội"
        tracking_code:
          type: string
          nullable: true
          example: "GHN88291039VN"
        carrier_name:
          type: string
          nullable: true
          example: "Giao Hàng Nhanh (GHN)"
        shipping_fee:
          type: integer
          nullable: true
          example: 30000
        subtotal:
          type: integer
          example: 770000
        total:
          type: integer
          example: 800000
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemPublicSummary'
        timeline:
          type: array
          items:
            type: object
            required:
              - stage
              - timestamp
              - description
            properties:
              stage:
                type: string
                example: "Đặt đơn thành công"
              timestamp:
                type: string
                format: date-time
              description:
                type: string
                example: "Đơn hàng đã được tiếp nhận, chờ shop liên hệ chốt ship."

    OrderAdminSummary:
      type: object
      required:
        - default_shipping_fee
        - freeship_applied
        - deposit_status
        - deposit_amount
        - hold_expires_at
        - amount_due
        - id
        - order_code
        - customer_name
        - customer_phone
        - total_items
        - subtotal
        - payment_method
        - order_status
        - payment_status
        - created_at
      properties:
        default_shipping_fee:
          type: integer
          nullable: true
          description: Phí ship mặc định (1 chiều) lấy từ cài đặt `default_shipping_fee` lúc đặt đơn, trước khi tính freeship. null với đơn tạo trước khi có phí mặc định.
          example: 30000
        freeship_applied:
          type: boolean
          description: Đơn đủ số món để freeship (cài đặt `freeship_min_items`, chốt lúc đặt) nên `shipping_fee` lúc đặt = 0. Shop vẫn đổi được phí khi xác nhận (khu vực đặc biệt); UI admin cảnh báo khi đổi.
          example: false
        id:
          type: string
          example: "order_123"
        order_code:
          type: string
          example: "DH-260901"
        customer_name:
          type: string
          example: "Nguyễn Văn An"
        customer_phone:
          type: string
          example: "0912345678"
        total_items:
          type: integer
          example: 2
        subtotal:
          type: integer
          example: 770000
        shipping_fee:
          type: integer
          nullable: true
          example: 30000
        total:
          type: integer
          example: 800000
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        carrier_name:
          type: string
          nullable: true
          example: "GHN"
        deposit_status:
          $ref: '#/components/schemas/DepositStatus'
        deposit_amount:
          type: integer
          description: Tiền cọc của đơn, chốt theo cài đặt lúc tạo đơn (mặc định 50.000₫ với số điện thoại chưa có đơn hoàn tất, 0 nếu không cần cọc)
          example: 50000
        amount_due:
          type: integer
          description: Số tiền khách còn phải trả cho đơn = `total` − tiền cọc đã nhận (cọc đã chuyển được trừ vào đơn)
          example: 750000
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hết giờ giữ đơn (đơn `new`). Hết giờ mà shop chưa xử lý → đơn cần cọc chưa nhận cọc thì tự hủy (món về kệ); đơn không cần cọc hoặc đã nhận cọc thì tự động xác nhận. Chỉ có ý nghĩa khi đơn còn `new`.
        tracking_code:
          type: string
          nullable: true
          example: "GHN88291039VN"
        created_at:
          type: string
          format: date-time

    OrderAdminDetail:
      allOf:
        - $ref: '#/components/schemas/OrderAdminSummary'
        - type: object
          required:
            - shipping_address
            - items
            - timeline
            - completed_at
            - cancelled_at
            - returned_at
            - refund_amount
            - return_fee
            - agreed_return_fee
            - return_window_days
            - hold_minutes
            - hold_extended_at
            - hold_extension_minutes
            - cancelled_by
            - confirmed_by
            - policy_accepted_at
            - policy_version
            - deposit_paid_at
            - shipped_at
            - paid_at
          properties:
            customer_id:
              type: string
              nullable: true
              description: Mã khách nếu đơn được đặt khi đã đăng nhập
              example: "KH-1001"
            shipping_address:
              type: string
              example: "Số 48 Tràng Tiền, Hoàn Kiếm, Hà Nội"
            customer_note:
              type: string
              nullable: true
              example: "Giao giờ hành chính"
            admin_note:
              type: string
              nullable: true
              example: "Đã gọi điện chốt ship 30k"
            actual_shipping_cost:
              type: integer
              nullable: true
              description: Cước thực tế trả bưu cục
              example: 28000
            shipping_margin:
              type: integer
              nullable: true
              description: Chênh lệch cước = phí ship thu khách - cước thực trả bưu cục. Dương là dư cước, âm là bù cước.
              example: 2000
            shipped_at:
              type: string
              format: date-time
              nullable: true
              description: Lúc bàn giao bưu cục (cước thực tế được chi tại mốc này)
            paid_at:
              type: string
              format: date-time
              nullable: true
              description: Lúc tiền về tài khoản shop (chuyển khoản khớp hoặc COD đối soát xong)
            completed_at:
              type: string
              format: date-time
              nullable: true
            cancelled_at:
              type: string
              format: date-time
              nullable: true
            returned_at:
              type: string
              format: date-time
              nullable: true
            refund_amount:
              type: integer
              nullable: true
              description: |
                Tiền hoàn cho khách (ADR 004/005). Trả hàng: `subtotal` − (tiền cọc nếu đơn có cọc, nếu không thì `agreed_return_fee`), tối thiểu 0.
                Hủy đơn: shop hủy (bất kỳ lúc nào) hoặc khách hủy trước khi shop xác nhận → hoàn cọc đã nhận. Khách hủy sau khi đơn đã xác nhận → mất cọc (`deposit_status` = `forfeited`).
                Đơn đã thu đủ tiền bị hủy: `subtotal` (trừ cọc nếu cọc bị mất), phí ship không hoàn.
            return_fee:
              type: integer
              nullable: true
              description: Phí ship 2 chiều đã thu khi trả đơn không có cọc (= `agreed_return_fee`, trừ vào tiền hoàn). `null` nếu không áp dụng.
            agreed_return_fee:
              type: integer
              description: Phí ship 2 chiều khách chịu nếu trả đơn không có cọc, chốt theo cài đặt lúc tạo đơn (ADR 005)
              example: 50000
            return_window_days:
              type: integer
              description: Số ngày được trả kể từ lúc hoàn tất, chốt theo cài đặt lúc tạo đơn (ADR 005)
              example: 2
            hold_minutes:
              type: integer
              description: Số phút giữ đơn chốt lúc tạo đơn (ADR 005)
              example: 30
            policy_accepted_at:
              type: string
              format: date-time
              nullable: true
              description: Lúc khách đồng ý chính sách đặt cọc & hoàn hàng (giờ server nhận đơn). null với đơn cũ trước khi có bước đồng ý.
            policy_version:
              type: integer
              nullable: true
              description: Phiên bản chính sách khách đã đồng ý
              example: 1
            deposit_paid_at:
              type: string
              format: date-time
              nullable: true
              description: Lúc shop nhận cọc (tính vào tiền thực về tại mốc này)
            cancel_reason:
              type: string
              nullable: true
              example: "Khách đổi ý"
            cancelled_by:
              $ref: '#/components/schemas/CancelActor'
            confirmed_by:
              $ref: '#/components/schemas/ConfirmActor'
            hold_extended_at:
              type: string
              format: date-time
              nullable: true
              description: Lúc shop gia hạn giữ đơn (mỗi đơn 1 lần). null = chưa gia hạn.
            hold_extension_minutes:
              type: integer
              nullable: true
              description: Số phút đã gia hạn (nhỏ hơn `hold_minutes`)
              example: 15
            items:
              type: array
              description: Món trong đơn. Tên, ảnh và giá là bản chụp lúc đặt (sửa món sau đó không đổi đơn cũ); `status` là trạng thái hiện tại của món.
              items:
                $ref: '#/components/schemas/ItemAdminSummary'
            timeline:
              type: array
              items:
                type: object
                required:
                  - action
                  - actor
                  - timestamp
                properties:
                  action:
                    type: string
                    example: "Chốt phí vận chuyển 30.000₫"
                  actor:
                    type: string
                    example: "Chủ shop"
                  timestamp:
                    type: string
                    format: date-time

    BatchSummary:
      type: object
      required:
